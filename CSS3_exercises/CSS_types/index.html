<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inclusion Methods</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="styles.css">

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">Welcome to CSS Styling Methods</h1>

    <header>
        <h2>Header Section</h2>
    </header>

    <main>
        <p>
            This page demonstrates Inline, Internal, and External CSS.
        </p>
    </main>

</body>
</html>
