<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography Demo</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>City Events Portal</h1>
    </header>

    <main>
        <section>
            <h2>Upcoming Events</h2>

            <p class="description">
                Join exciting community events and stay connected with your city.
                Discover workshops, cultural programs, and educational activities
                designed for all age groups.
            </p>

            <p class="highlight">
                Registration closes soon!
            </p>
        </section>
    </main>

</body>
</html>
