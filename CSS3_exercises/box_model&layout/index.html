<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model & Layout Control</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Event Management Portal</h1>

    <!-- Event Cards -->
    <div class="eventCard">
        <h2>Tech Conference</h2>
        <p>Date: 15 June 2026</p>
    </div>

    <div class="eventCard">
        <h2>AI Workshop</h2>
        <p>Date: 25 June 2026</p>
    </div>

    <!-- Form Section -->
    <h2>Registration Form</h2>

    <form>
        <input type="text" class="selectedField"
               placeholder="Enter your name">
    </form>

    <!-- Visibility Examples -->
    <div class="hiddenBox">
        This uses visibility: hidden
    </div>

    <div class="noneBox">
        This uses display: none
    </div>

    <p>
        This text appears after the visibility examples.
    </p>

</body>
</html>
