<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Banner using ID Selector -->
    <header id="mainHeader">
        <h1>Event Management System</h1>
    </header>

    <!-- Element Selector -->
    <h2>Upcoming Events</h2>

    <!-- Class Selector -->
    <div class="eventCard">
        <h3>Tech Conference 2026</h3>
        <p>Date: June 15, 2026</p>
    </div>

    <div class="eventCard">
        <h3>Web Development Workshop</h3>
        <p>Date: July 10, 2026</p>
    </div>

</body>
</html>
